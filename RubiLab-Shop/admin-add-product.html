<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj Produkt — Admin RubiLab</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Firebase Compat v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        .admin-section {
            padding: 120px 0 60px 0;
            min-height: 100vh;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(15, 15, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-group input, .form-group textarea, .form-group select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 14px 18px;
            border-radius: 12px;
            font-family: var(--font-family);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--primary);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 3px rgba(255, 0, 85, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .helper-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <!-- Skrypty bazowe -->
    <script src="js/auth.js"></script>
    <script src="js/admin-guard.js"></script> <!-- Blokada dostępu -->

    <!-- NAGŁÓWEK -->
    <header id="main-header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                Rubi<span class="logo-accent">Lab</span> <span style="font-size: 0.9rem; color: var(--danger); margin-left: 10px;">[ADMIN]</span>
            </a>
            
            <nav id="navbar">
                <a href="admin.html" class="nav-link">Kokpit Admina</a>
                <a href="admin-orders.html" class="nav-link">Zamówienia</a>
                <a href="admin-add-product.html" class="nav-link active">Dodaj Produkt</a>
            </nav>

            <div class="header-actions">
                <a href="admin.html" class="btn btn-outline btn-sm">Wróć do kokpitu</a>
            </div>
        </div>
    </header>

    <main class="admin-section">
        <div class="container">
            <div class="section-header" style="text-align: center; margin-bottom: 40px;">
                <h1 class="section-title">Dodaj nowy produkt ➕</h1>
                <p class="section-subtitle">Wypełnij poniższe dane, aby dodać zabawkę do bazy sklepu.</p>
            </div>

            <div class="form-container">
                <form id="add-product-form">
                    <div class="form-grid">
                        
                        <div class="form-group full-width">
                            <label for="p-name">Nazwa Produktu</label>
                            <input type="text" id="p-name" required placeholder="np. Kinetyczny Ośmiornica 3D">
                        </div>

                        <div class="form-group">
                            <label for="p-price">Cena (zł)</label>
                            <input type="number" step="0.01" id="p-price" required placeholder="np. 49.99">
                        </div>

                        <div class="form-group">
                            <label for="p-stock">Ilość w magazynie</label>
                            <input type="number" id="p-stock" required placeholder="np. 15">
                        </div>

                        <div class="form-group">
                            <label for="p-category">Kategoria</label>
                            <select id="p-category" required>
                                <option value="ADHD">ADHD Fidgets</option>
                                <option value="Anti-stress">Antystresowe / ASMR</option>
                                <option value="Kinetic">Pierścienie Kinetyczne</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="p-rating">Domyślna Ocena (1-5)</label>
                            <input type="number" step="0.1" id="p-rating" value="5.0" max="5" min="1" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="p-colors">Dostępne Kolory (oddzielone przecinkami)</label>
                            <input type="text" id="p-colors" required placeholder="np. Czerwony, Niebieski, Zielony">
                            <span class="helper-text">Klienci będą mogli wybrać jeden z tych kolorów podczas zakupu.</span>
                        </div>

                        <div class="form-group full-width">
                            <label for="p-image">Link do zdjęcia (URL)</label>
                            <input type="url" id="p-image" required placeholder="https://twoj-hosting.pl/zdjecie1.png">
                            <span class="helper-text">Ponieważ nie używamy Firebase Storage, wklej tutaj bezpośredni link do obrazka.</span>
                        </div>

                        <div class="form-group full-width">
                            <label for="p-desc">Opis Produktu</label>
                            <textarea id="p-desc" required placeholder="Opisz swój produkt..."></textarea>
                        </div>
                    </div>

                    <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
                        <button type="submit" class="btn btn-primary btn-lg" id="submit-btn">
                            Zapisz produkt do bazy
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('add-product-form');
            const submitBtn = document.getElementById('submit-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                // Pobranie danych z formularza
                const name = document.getElementById('p-name').value.trim();
                const price = parseFloat(document.getElementById('p-price').value);
                const stock = parseInt(document.getElementById('p-stock').value, 10);
                const category = document.getElementById('p-category').value;
                const rating = parseFloat(document.getElementById('p-rating').value);
                const colorsRaw = document.getElementById('p-colors').value;
                const image = document.getElementById('p-image').value.trim();
                const desc = document.getElementById('p-desc').value.trim();

                // Przetwarzanie kolorów w tablicę
                const colors = colorsRaw.split(',').map(c => c.trim()).filter(c => c.length > 0);

                if (!window.db) {
                    window.showToast("Błąd: Brak połączenia z bazą Firestore", "error");
                    return;
                }

                // Efekt ładowania
                const originalText = submitBtn.innerHTML;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loader-spinner" style="border-width: 2px; width: 14px; height: 14px;"></span> Zapisywanie...';

                try {
                    // Dodanie produktu do kolekcji 'products'
                    await window.db.collection('products').add({
                        name: name,
                        price: price,
                        stock: stock,
                        category: category,
                        rating: rating,
                        colors: colors,
                        image: image,
                        description: desc,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    window.showToast("Produkt został dodany!", "success");
                    form.reset(); // Czyszczenie formularza
                    document.getElementById('p-rating').value = "5.0"; // Przywracanie domyślnej

                } catch (error) {
                    console.error("Error adding document: ", error);
                    window.showToast("Wystąpił błąd podczas dodawania produktu.", "error");
                } finally {
                    // Przywrócenie przycisku
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                }
            });
        });
    </script>
</body>
</html>
