<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasa — RubiLab</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        .checkout-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 40px;
            margin-top: 120px;
            margin-bottom: 60px;
        }

        .checkout-panel {
            padding: 30px;
        }

        .checkout-panel h2 {
            margin-bottom: 25px;
            color: var(--primary);
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 10px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        .summary-item {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed var(--border-glass);
        }

        .summary-item-img {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .summary-item-info {
            flex: 1;
        }

        .summary-item-info h4 {
            font-size: 0.95rem;
            margin: 0 0 5px 0;
        }

        .summary-item-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
        }

        .summary-item-price {
            font-weight: bold;
            color: var(--primary);
        }

        .summary-total {
            margin-top: 20px;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .summary-total span:last-child {
            font-size: 1.5rem;
            color: var(--primary);
        }

        @media (max-width: 900px) {
            .checkout-container {
                grid-template-columns: 1fr;
                margin-top: 100px;
            }
            .checkout-panel {
                order: 2;
            }
            .checkout-summary {
                order: 1;
            }
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <!-- Glow -->
    <div class="glow-sphere glow-sphere-1"></div>
    <div class="glow-sphere glow-sphere-2"></div>

    <header id="main-header" style="background: rgba(7, 7, 10, 0.9);">
        <div class="container header-container">
            <a href="index.html" class="logo">
                Rubi<span class="logo-accent">Lab</span>
            </a>
            <div style="color: var(--text-muted); display: flex; align-items: center; gap: 10px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Bezpieczna płatność
            </div>
        </div>
    </header>

    <div class="container checkout-container">
        <!-- Formularz Danych -->
        <div class="glass-panel checkout-panel">
            <h2>Dane do wysyłki</h2>
            <form id="checkout-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Imię</label>
                        <input type="text" id="chk-fname" required>
                    </div>
                    <div class="form-group">
                        <label>Nazwisko</label>
                        <input type="text" id="chk-lname" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adres E-mail</label>
                    <input type="email" id="chk-email" required>
                </div>

                <div class="form-group">
                    <label>Telefon</label>
                    <input type="tel" id="chk-phone" required>
                </div>

                <h3 style="margin: 30px 0 15px 0; color: var(--primary);">Adres Dostawy</h3>

                <div class="form-row">
                    <div class="form-group" style="flex: 2;">
                        <label>Ulica i numer domu/lokalu</label>
                        <input type="text" id="chk-street" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Kod pocztowy</label>
                        <input type="text" id="chk-zip" required>
                    </div>
                    <div class="form-group" style="flex: 2;">
                        <label>Miejscowość</label>
                        <input type="text" id="chk-city" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Metoda płatności</label>
                    <select id="chk-payment" required style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); border-radius: 8px; color: var(--text-light);">
                        <option value="blik" style="color: black;">BLIK</option>
                        <option value="card" style="color: black;">Karta Płatnicza</option>
                        <option value="transfer" style="color: black;">Szybki Przelew</option>
                    </select>
                </div>

                <button type="submit" id="submit-order-btn" class="btn btn-primary btn-block" style="margin-top: 30px; font-size: 1.2rem; padding: 15px;">
                    Zamawiam i płacę
                </button>
            </form>
        </div>

        <!-- Podsumowanie -->
        <div class="glass-panel checkout-panel checkout-summary">
            <h2>Podsumowanie</h2>
            <div id="checkout-items">
                <!-- Javascript will populate -->
            </div>
            
            <div style="margin-top: 15px; display: flex; justify-content: space-between; color: var(--text-muted);">
                <span>Dostawa</span>
                <span style="color: var(--success);">Darmowa</span>
            </div>

            <div class="summary-total">
                <span>Do zapłaty:</span>
                <span id="checkout-total-price">0.00 zł</span>
            </div>
        </div>
    </div>

    <!-- Skrypty -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const itemsContainer = document.getElementById('checkout-items');
            const totalEl = document.getElementById('checkout-total-price');
            const emailInput = document.getElementById('chk-email');
            
            // Pobierz koszyk z LocalStorage
            let cartItems = JSON.parse(localStorage.getItem('rubilab_cart')) || [];
            
            if (cartItems.length === 0) {
                alert("Twój koszyk jest pusty!");
                window.location.href = "index.html";
                return;
            }

            // Render Items
            let total = 0;
            itemsContainer.innerHTML = cartItems.map(item => {
                total += item.price * item.quantity;
                return `
                    <div class="summary-item">
                        <div class="summary-item-img">
                            ${item.svgMarkup}
                        </div>
                        <div class="summary-item-info">
                            <h4>${item.name}</h4>
                            <p>Kolor: ${item.color} | Ilość: ${item.quantity}</p>
                        </div>
                        <div class="summary-item-price">
                            ${(item.price * item.quantity).toFixed(2)} zł
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.textContent = total.toFixed(2) + ' zł';

            // Auto-fill email if logged in
            firebase.auth().onAuthStateChanged(user => {
                if(user) {
                    emailInput.value = user.email;
                }
            });

            // Handle Submit
            const form = document.getElementById('checkout-form');
            const submitBtn = document.getElementById('submit-order-btn');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = "Przetwarzanie...";

                if (!window.db) {
                    alert("Brak połączenia z bazą danych.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Zamawiam i płacę";
                    return;
                }

                const orderData = {
                    customerName: document.getElementById('chk-fname').value + ' ' + document.getElementById('chk-lname').value,
                    customerEmail: document.getElementById('chk-email').value,
                    customerPhone: document.getElementById('chk-phone').value,
                    address: {
                        street: document.getElementById('chk-street').value,
                        zip: document.getElementById('chk-zip').value,
                        city: document.getElementById('chk-city').value
                    },
                    paymentMethod: document.getElementById('chk-payment').value,
                    items: cartItems,
                    totalPrice: total,
                    status: 'Oczekujące na płatność',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };

                try {
                    await window.db.collection('orders').add(orderData);
                    // Wyczyść koszyk
                    localStorage.removeItem('rubilab_cart');
                    // Przejdź do strony sukcesu
                    window.location.href = 'success.html';
                } catch(error) {
                    console.error("Błąd zapisu zamówienia: ", error);
                    alert("Wystąpił błąd podczas składania zamówienia. Spróbuj ponownie.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Zamawiam i płacę";
                }
            });
        });
    </script>
</body>
</html>
