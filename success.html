<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziękujemy! — RubiLab</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .success-panel {
            max-width: 600px;
            padding: 50px 40px;
            position: relative;
            z-index: 10;
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: var(--primary);
            opacity: 0;
        }
    </style>
</head>

<body>
    <!-- Glow -->
    <div class="glow-sphere glow-sphere-1"></div>
    <div class="glow-sphere glow-sphere-2"></div>

    <div class="glass-panel success-panel animate-fade-in-up">
        <div class="success-icon">🎉</div>
        <h1 style="color: var(--primary); margin-bottom: 15px;">Zamówienie przyjęte!</h1>
        <p style="font-size: 1.1rem; margin-bottom: 30px; color: var(--text-light);">
            Dziękujemy za zakupy w RubiLab.<br>Twoje zamówienie zostało pomyślnie przesłane do naszego systemu.
            Niebawem zabierzemy się za drukowanie Twojej nowej, antystresowej zabawki!
        </p>

        <a href="index.html" class="btn btn-primary btn-lg" style="padding: 12px 40px;">
            Wróć na stronę główną
        </a>
    </div>

    <!-- Prosty system konfetti -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const colors = ['#ff0055', '#00f0ff', '#ffcc00', '#00ff88'];
            for (let i = 0; i < 50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = -10 + 'px';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                conf.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(conf);
            }
        });
    </script>
    <style>
        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</body>

</html>
