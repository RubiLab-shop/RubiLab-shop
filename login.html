<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Zaloguj się do swojego konta RubiLab lub zarejestruj się, aby śledzić zamówienia na zabawki 3D ADHD i antystresowe.">
    <title>Zaloguj się — RubiLab</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    
    <!-- Firebase Compat v10 (nie wymaga serwera) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <div class="auth-layout">
        <!-- Lewa sekcja (Panel Logowania) -->
        <div class="auth-left">
            <a href="index.html" class="back-home">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Wróć do sklepu
            </a>

            <div class="auth-glass-container">
                <a href="index.html" class="auth-header-brand">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span>Rubi<b>Lab</b></span>
                </a>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">Zaloguj się</button>
                    <button class="auth-tab" data-tab="register">Rejestracja</button>
                </div>

                <div id="auth-error-msg" class="auth-error-msg"></div>

                <!-- Panel Logowania -->
                <div id="login-panel">
                    <form id="login-form">
                        <div class="auth-input-group">
                            <label for="login-email">Adres E-mail</label>
                            <input type="email" id="login-email" required placeholder="twoj@adres.pl">
                        </div>
                        <div class="auth-input-group">
                            <label for="login-password">Hasło</label>
                            <input type="password" id="login-password" required placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 10px; border-radius: 14px;">Zaloguj się</button>
                    </form>
                </div>

                <!-- Panel Rejestracji -->
                <div id="register-panel" class="hidden">
                    <form id="register-form">
                        <div class="auth-input-group">
                            <label for="reg-username">Imię / Nick</label>
                            <input type="text" id="reg-username" required placeholder="np. Jan Kowalski">
                        </div>
                        <div class="auth-input-group">
                            <label for="reg-email">Adres E-mail</label>
                            <input type="email" id="reg-email" required placeholder="twoj@adres.pl">
                        </div>
                        <div class="auth-input-group">
                            <label for="reg-password">Hasło</label>
                            <input type="password" id="reg-password" required placeholder="Minimum 6 znaków">
                        </div>
                        <div class="auth-input-group">
                            <label for="reg-confirm">Potwierdź hasło</label>
                            <input type="password" id="reg-confirm" required placeholder="Minimum 6 znaków">
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 10px; border-radius: 14px;">Utwórz darmowe konto</button>
                    </form>
                </div>

                <div class="auth-divider">ALBO UŻYJ</div>

                <button class="btn btn-google btn-block" id="google-login-btn" style="border-radius: 14px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                    </svg>
                    Zaloguj przez Google
                </button>
            </div>
        </div>

        <!-- Prawa sekcja (Animowane tło graficzne) -->
        <div class="auth-right">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <canvas id="hero-canvas" style="position: absolute; top:0; left:0; width:100%; height:100%; z-index: 2; mix-blend-mode: screen;"></canvas>
            
            <div class="auth-right-content">
                <h2>Odkryj Spokój</h2>
                <p>Dołącz do RubiLab i uzyskaj dostęp do ekskluzywnych kolekcji zabawek antystresowych drukowanych w technologii 3D.</p>
            </div>
        </div>
    </div>

    <!-- SKRYPTY Aplikacji (Kolejność jest ważna) -->
    <script src="js/products-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script> <!-- Brak type="module", pełna kompatybilność lokalna! -->
</body>
</html>
