<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zamówienia — Admin RubiLab</title>
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Firebase Compat v10 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        .admin-section {
            padding: 120px 0 60px 0;
            min-height: 100vh;
        }

        .orders-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(15, 15, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-lg);
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 20px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: top;
            color: white;
            font-size: 0.95rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .order-id {
            font-family: monospace;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .product-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .product-list li {
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .product-list li:last-child {
            margin-bottom: 0;
        }

        .total-price {
            font-weight: 700;
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <!-- Skrypty bazowe -->
    <script src="js/auth.js"></script>
    <script src="js/admin-guard.js"></script> <!-- Blokada dostępu -->

    <!-- NAGŁÓWEK -->
    <header id="main-header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                Rubi<span class="logo-accent">Lab</span> <span style="font-size: 0.9rem; color: var(--danger); margin-left: 10px;">[ADMIN]</span>
            </a>
            
            <nav id="navbar">
                <a href="admin.html" class="nav-link">Kokpit Admina</a>
                <a href="admin-orders.html" class="nav-link active">Zamówienia</a>
                <a href="admin-add-product.html" class="nav-link">Dodaj Produkt</a>
            </nav>

            <div class="header-actions">
                <a href="admin.html" class="btn btn-outline btn-sm">Wróć do kokpitu</a>
            </div>
        </div>
    </header>

    <main class="admin-section">
        <div class="container">
            <div class="section-header" style="text-align: center; margin-bottom: 40px;">
                <h1 class="section-title">Lista Zamówień 📦</h1>
                <p class="section-subtitle">Wszystkie zakupy zrealizowane przez klientów sklepu.</p>
            </div>

            <div class="orders-container">
                <table id="orders-table">
                    <thead>
                        <tr>
                            <th>Data & ID</th>
                            <th>Klient</th>
                            <th>Produkty (Kolor, Materiał, Ilość)</th>
                            <th>Kwota</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="orders-list">
                        <tr>
                            <td colspan="5" class="empty-state">
                                <span class="loader-spinner" style="border-width: 3px; width: 24px; height: 24px; border-top-color: var(--primary);"></span>
                                <br><br>Ładowanie zamówień...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ordersList = document.getElementById('orders-list');

            // Funkcja pobierająca i renderująca zamówienia z Firestore
            const fetchOrders = async () => {
                if (!window.db) return;

                try {
                    // Pobieramy kolekcję zamówień posortowaną od najnowszych
                    const snapshot = await window.db.collection('orders').orderBy('createdAt', 'desc').get();
                    
                    if (snapshot.empty) {
                        ordersList.innerHTML = `
                            <tr>
                                <td colspan="5" class="empty-state">Brak złożonych zamówień w bazie.</td>
                            </tr>
                        `;
                        return;
                    }

                    ordersList.innerHTML = ''; // Wyczyszczenie loading state

                    snapshot.forEach(doc => {
                        const order = doc.data();
                        const orderId = doc.id;
                        
                        // Formatowanie daty
                        let dateString = "Brak daty";
                        if (order.createdAt) {
                            const date = order.createdAt.toDate();
                            dateString = date.toLocaleDateString('pl-PL', { 
                                year: 'numeric', month: 'short', day: 'numeric',
                                hour: '2-digit', minute: '2-digit'
                            });
                        }

                        // Tworzenie HTML dla koszyka produktów
                        let productsHtml = '<ul class="product-list">';
                        if (order.items && Array.isArray(order.items)) {
                            order.items.forEach(item => {
                                productsHtml += `
                                    <li>
                                        <strong>${item.name}</strong> x${item.quantity}<br>
                                        <span style="color: var(--text-muted);">
                                            Kolor: ${item.selectedColor || 'Domyślny'}, 
                                            Materiał: ${item.selectedMaterial || 'Domyślny'}
                                        </span>
                                    </li>
                                `;
                            });
                        } else {
                            productsHtml += '<li>Brak szczegółów produktów</li>';
                        }
                        productsHtml += '</ul>';

                        // Klient
                        const customerInfo = `
                            <strong>${order.customerName || 'Nieznany'}</strong><br>
                            <span style="color: var(--text-muted); font-size: 0.85rem;">${order.customerEmail || ''}</span>
                        `;

                        // Render wiersza
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <div>${dateString}</div>
                                <div class="order-id">#${orderId.substring(0, 8)}...</div>
                            </td>
                            <td>${customerInfo}</td>
                            <td>${productsHtml}</td>
                            <td class="total-price">${(order.totalPrice || 0).toFixed(2)} zł</td>
                            <td><span class="status-badge" style="background: rgba(0, 200, 100, 0.2); color: #00ff88;">Opłacone</span></td>
                        `;
                        ordersList.appendChild(tr);
                    });

                } catch (error) {
                    console.error("Błąd pobierania zamówień:", error);
                    ordersList.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state" style="color: var(--danger);">
                                Wystąpił błąd podczas łączenia z bazą danych.<br>
                                Jeśli jesteś z lokalnego pliku (Tryb Demo), baza danych może być niedostępna.
                            </td>
                        </tr>
                    `;
                }
            };

            // Ponieważ onAuthStateChanged może chwilę potrwać, nasłuchujemy również auth
            auth.onAuthStateChanged(user => {
                if (user && user.email === 'rubilab3dd@gmail.com') {
                    fetchOrders();
                }
            });
        });
    </script>
</body>
</html>
